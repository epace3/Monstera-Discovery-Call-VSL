# Monstera / North Group - discovery call funnel
# Routing: /  ->  registration      /booked  and  /confirmed  ->  confirmations
# Point each Calendly event's redirect at the correct confirmation path.

[build]
  publish = "site"
  command = "./build.sh"

# The real privacy policy and terms live on monstera.ca and already cover this
# funnel. These 301s keep any older /privacy or /terms link working instead of
# serving a second, competing copy of the same policy.
[[redirects]]
  from = "/privacy"
  to = "https://monstera.ca/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "https://monstera.ca/terms"
  status = 301
  force = true

# Long cache on the review screenshots: they are content-stable and
# fingerprinted by filename. Keeps repeat visits fast.
[[headers]]
  for = "/review-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so an edit goes live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Neither confirmation page should ever be indexed. They also carry a
# noindex meta tag; this is the belt to that pair of braces.
[[headers]]
  for = "/booked/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/confirmed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
